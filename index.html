<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BidMachine Supply Sales Dashboard v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:       #0f1117;
    --surface:  #181c27;
    --card:     #1e2336;
    --border:   #2a2f45;
    --accent:   #4f7cff;
    --accent2:  #34d399;
    --accent3:  #f59e0b;
    --accent4:  #f87171;
    --text:     #e8eaf0;
    --muted:    #6b7280;
    --pill-bg:  #252b40;
    --radius:   10px;
    --font:     -apple-system, 'Segoe UI', system-ui, sans-serif;
    --mono:     'SF Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }

  /* ── Layout ── */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .main { flex: 1; padding: 2rem 2.5rem; overflow-x: hidden; }

  /* ── Sidebar ── */
  .sidebar-logo { padding: 0 1.25rem 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
  .sidebar-logo .wordmark { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: .02em; }
  .sidebar-logo .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sidebar-section { padding: 0 1.25rem; margin-bottom: .25rem; }
  .sidebar-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: .5rem; padding: 0 .25rem; }
  .rep-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 7px; border: none; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; text-align: left; transition: background .12s, color .12s; }
  .rep-btn:hover { background: var(--card); color: var(--text); }
  .rep-btn.active { background: var(--accent); color: #fff; }
  .rep-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; }
  .rep-btn.active .rep-avatar { background: rgba(255,255,255,.2); }
  .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 1rem 1.25rem; }
  .add-rep-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; margin: 0 0 0 0; border-radius: 7px; border: 1px dashed var(--border); background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; text-align: left; transition: border-color .12s, color .12s; }
  .add-rep-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Header ── */
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
  .page-header-left .rep-name { font-size: 22px; font-weight: 600; }
  .page-header-left .page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .period-tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; }
  .period-tab { padding: 6px 14px; border-radius: 7px; border: none; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; transition: background .12s, color .12s; }
  .period-tab.active { background: var(--card); color: var(--text); font-weight: 500; }

  /* ── Stat cards ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 2rem; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.125rem; cursor: pointer; transition: border-color .15s, transform .1s; position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent-color, var(--accent)); }
  .stat-card:hover { border-color: var(--accent-color, var(--accent)); transform: translateY(-1px); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
  .stat-value { font-size: 32px; font-weight: 700; color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 5px; }

  /* ── Chart ── */
  .chart-section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .chart-title { font-size: 13px; font-weight: 600; }
  .chart-legend { display: flex; gap: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chart-wrap { height: 180px; position: relative; }

  /* ── Stage breakdown ── */
  .section-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 1rem; }
  .stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-bottom: 2rem; }
  .stage-pill { display: flex; align-items: center; justify-content: space-between; background: var(--pill-bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; cursor: pointer; transition: border-color .12s; }
  .stage-pill:hover { border-color: var(--accent); }
  .stage-pill-name { font-size: 12px; color: var(--text); }
  .stage-pill-count { font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ── Drawer overlay ── */
  .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100; }
  .drawer-overlay.open { display: block; }
  .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 480px; max-width: 95vw; background: var(--surface); border-left: 1px solid var(--border); z-index: 101; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s cubic-bezier(.4,0,.2,1); }
  .drawer.open { transform: translateX(0); }
  .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .drawer-title { font-size: 14px; font-weight: 600; }
  .drawer-count { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .drawer-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; padding: 2px; }
  .drawer-close:hover { color: var(--text); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
  .drawer-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .drawer-item:last-child { border-bottom: none; }
  .drawer-item-name { font-size: 13px; font-weight: 500; }
  .drawer-item-name a { color: var(--accent); text-decoration: none; }
  .drawer-item-name a:hover { text-decoration: underline; }
  .drawer-item-meta { display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
  .drawer-meta-tag { font-size: 11px; color: var(--muted); }
  .drawer-meta-amount { font-size: 11px; color: var(--accent2); font-weight: 500; }
  .drawer-item-notes { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .drawer-empty { font-size: 13px; color: var(--muted); padding: 2rem 0; text-align: center; }

  /* ── Footer ── */
  .page-footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
  .footer-text { font-size: 11px; color: var(--muted); }
  .footer-link { font-size: 11px; color: var(--accent); text-decoration: none; }
  .footer-link:hover { text-decoration: underline; }

  /* ── Loading / error ── */
  .state-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Responsive ── */
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .main { padding: 1.25rem; }
    .stat-value { font-size: 24px; }
    .drawer { width: 100vw; }
  }

  /* ── Deal Nudger ── */
  .nudger-wrap { margin-bottom: 2rem; }
  .nudger-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 1.25rem; position: relative; overflow: hidden; }
  .nudger-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, #f59e0b, #f87171); }
  .nudger-icon { font-size: 22px; flex-shrink: 0; }
  .nudger-body { flex: 1; min-width: 0; }
  .nudger-eyebrow { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
  .nudger-name { font-size: 16px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .nudger-meta { display: flex; gap: 12px; flex-wrap: wrap; }
  .nudger-stage { font-size: 12px; color: var(--muted); }
  .nudger-days { font-size: 12px; font-weight: 600; color: #f87171; }
  .nudger-amount { font-size: 12px; color: var(--accent2); }
  .nudger-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; flex-shrink: 0; }
  .nudger-open { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; transition: opacity .12s; }
  .nudger-open:hover { opacity: .85; }
  .nudger-skip { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0; }
  .nudger-skip:hover { color: var(--text); }
  .nudger-progress { font-size: 11px; color: var(--muted); text-align: right; }
  .nudger-empty { font-size: 13px; color: var(--muted); text-align: center; padding: .5rem 0; }

  /* ── Signed partners ── */
  .view-btn .rep-avatar { font-size: 13px; }
  .sp-mobile-switch { display: none; }
  .sp-table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; margin-bottom: 2rem; }
  .sp-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .sp-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .sp-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .sp-table tr:last-child td { border-bottom: none; }
  .sp-table td.num, .sp-table th.num { text-align: right; }
  .sp-table a { color: var(--accent); text-decoration: none; }
  .sp-table a:hover { text-decoration: underline; }
  .sp-table tbody tr { cursor: pointer; }
  .sp-table tbody tr:hover td { background: var(--surface); }
  .sp-pos { color: var(--accent2); font-weight: 600; }
  .sp-neg { color: var(--accent4); font-weight: 600; }
  .sp-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--pill-bg); color: var(--muted); border: 1px solid var(--border); }
  .sp-badge.live { color: var(--accent2); border-color: rgba(52,211,153,.35); }
  .sp-badge.none { color: var(--accent3); border-color: rgba(245,158,11,.35); }
  .sp-partner { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; scroll-margin-top: 1rem; }
  .sp-partner-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .sp-partner-name { font-size: 16px; font-weight: 600; }
  .sp-partner-name a { color: var(--text); text-decoration: none; }
  .sp-partner-name a:hover { color: var(--accent); }
  .sp-partner-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .sp-kpis { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .sp-kpi-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .sp-kpi-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sp-charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .sp-chart { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .75rem .875rem; }
  .sp-chart-title { font-size: 12px; font-weight: 600; margin-bottom: .5rem; display: flex; justify-content: space-between; gap: 8px; }
  .sp-chart-title span { font-weight: 400; color: var(--muted); }
  .sp-chart-wrap { height: 150px; position: relative; }
  .sp-empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 1.25rem; font-size: 13px; color: var(--muted); }
  .sp-note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; max-width: 820px; }
  @media (max-width: 720px) {
    .sp-mobile-switch { display: flex; }
  }
</style>
</head>
<body>

<div class="shell">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark">BidMachine</div>
      <div class="sub">Supply Sales Dashboard</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Views</div>
      <button class="rep-btn view-btn active" data-view="activity" onclick="selectView('activity')">
        <div class="rep-avatar">📈</div><span>Sales activity</span>
      </button>
      <button class="rep-btn view-btn" data-view="partners" onclick="selectView('partners')">
        <div class="rep-avatar">✍️</div><span>Signed partners</span>
      </button>
    </div>
    <hr class="sidebar-divider">
    <div class="sidebar-section">
      <div class="sidebar-label">Sales reps</div>
      <div id="rep-list"></div>
    </div>
    <hr class="sidebar-divider">
    <div class="sidebar-section">
      <button class="add-rep-btn" onclick="showAddRepInfo()">
        <span style="font-size:16px">+</span> Add a rep
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main class="main" id="main">
    <div class="state-center" id="loading-state">
      <div class="spinner"></div>
      <div>Loading sales data…</div>
    </div>
    <div id="dashboard" style="display:none"></div>
  </main>
</div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div>
      <div class="drawer-title" id="drawer-title"></div>
      <div class="drawer-count" id="drawer-count"></div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let DATA = null;
let currentRepIdx = 0;
let currentPeriod = 'quarter';
let chartInstance = null;
let PARTNERS = null;
let currentView = 'activity';
let partnerCharts = [];


const PERIOD_LABELS = { quarter: 'This quarter', last_quarter: 'Last quarter', year: 'Year to date' };

const STAT_CONFIG = [
{ key: 'deals_touched',   label: 'Deals Working',          color: '#4f7cff', detail: 'deals_touched' },
  { key: 'meetings',        label: 'Meetings',                color: '#a78bfa', detail: 'meetings' },
  { key: 'new_deals',       label: 'New Deals Created',               color: '#34d399', detail: 'new_deals' },
  { key: 'stage_progressed',label: 'Deals progressed',        color: '#818cf8', detail: 'stage_progressed' },
  { key: 'qualified_out',   label: 'Qualified out',           color: '#f87171', detail: 'qualified_out' },
  { key: 'new_companies',   label: 'New Companies Created',           color: '#f59e0b', detail: 'new_companies' },
  { key: 'dau_tier1_added', label: 'Deals with Tier 1 DAU',   color: '#6ee7b7', detail: 'dau_tier1_added' },
  { key: 'peer_sdk',        label: 'Peer SDK qualified',      color: '#c084fc', detail: 'peer_sdk' },
];

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const res = await fetch('./data/sales_data.json?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
    // Signed partners live in their own file so generate_data.py and
    // refresh_nudger.py can never overwrite them. Missing file = empty tab.
    try {
      const sp = await fetch('./data/signed_partners.json?t=' + Date.now());
      if (sp.ok) PARTNERS = await sp.json();
    } catch (e) { PARTNERS = null; }
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    buildSidebar();
    render();
  } catch (e) {
    document.getElementById('loading-state').innerHTML = `
      <div style="color:#f87171;font-size:13px">Could not load sales_data.json</div>
      <div style="color:var(--muted);font-size:12px;max-width:320px;text-align:center">
        Run <code style="background:var(--card);padding:2px 6px;border-radius:4px">python fetch_data.py</code>
        then push to GitHub, or check the console for errors.
      </div>`;
  }
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('rep-list');
  list.innerHTML = DATA.reps.map((r, i) => {
    const initials = r.rep.name.split(' ').map(n => n[0]).join('').slice(0, 2);
    return `<button class="rep-btn ${i === 0 ? 'active' : ''}" onclick="selectRep(${i})">
      <div class="rep-avatar">${initials}</div>
      <span>${r.rep.name}</span>
    </button>`;
  }).join('');
}

function selectRep(idx) {
  currentRepIdx = idx;
  document.querySelectorAll('.rep-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  destroyPartnerCharts();
  if (currentView === 'partners') { renderPartners(); return; }
  if (currentPeriod === 'compare') { renderCompare(); addMobileSwitch(); return; }
  const rep = DATA.reps[currentRepIdx];
  const period = rep.periods[currentPeriod];
  const dash = document.getElementById('dashboard');

  dash.innerHTML = `
    <div class="page-header">
      <div class="page-header-left">
        <div class="rep-name">${rep.rep.name}</div>
        <div class="page-sub">Updated ${DATA.generated_date} · ${PERIOD_LABELS[currentPeriod]}</div>
      </div>
      <div class="period-tabs">
        ${['quarter','last_quarter','year','compare'].map(p => `
          <button class="period-tab ${p === currentPeriod ? 'active' : ''}" onclick="selectPeriod('${p}')">${p === 'compare' ? 'Q vs Q' : PERIOD_LABELS[p]}</button>
        `).join('')}
      </div>
    </div>

    ${period.stats.ooo_days > 0 ? `
    <div style="display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-left:3px solid #f87171;border-radius:var(--radius);padding:8px 14px;margin-bottom:1.25rem">
      <span style="font-size:13px;color:#f87171;font-weight:500">⚠ ${period.stats.ooo_days} working day${period.stats.ooo_days !== 1 ? 's' : ''} out of office this period</span>
      <span style="font-size:12px;color:var(--muted)">${period.detail.ooo ? period.detail.ooo.map(o=>o.date).join(', ') : ''}</span>
    </div>` : ''}

    <div class="stats-grid">
      ${STAT_CONFIG.map(s => {
        const val = period.stats[s.key] || 0;
        return `<div class="stat-card" style="--accent-color:${s.color}" onclick="openDrawer('${s.key}', '${s.label}')">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${val}</div>
          <div class="stat-sub">↗ click to view</div>
        </div>`;
      }).join('')}
    </div>

    <div class="nudger-wrap" id="nudger-wrap"></div>

    <div class="chart-section">
      <div class="chart-header">
        <div class="chart-title">${chartTitle()}</div>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="chart-legend">
            <div class="legend-item"><div class="legend-dot" style="background:#4f7cff"></div>Deals</div>
            <div class="legend-item"><div class="legend-dot" style="background:#34d399"></div>New deals</div>
            <div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div>Meetings</div>
          </div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="activity-chart"></canvas></div>
    </div>

    <div class="section-title">Stage breakdown — deals touched this ${currentPeriod === 'week' ? 'week' : currentPeriod}</div>
    <div class="stage-grid">
      ${renderStagePills(period)}
    </div>

    <div class="page-footer">
      <div class="footer-text">BidMachine Supply Sales Dashboard · data via HubSpot API</div>
      <a class="footer-link" href="https://app.hubspot.com/contacts/5606823/objects/0-3/?hubspot_owner_id=${rep.rep.id}" target="_blank" rel="noopener">View in HubSpot ↗</a>
    </div>`;

  renderChart(rep);
  buildNudgerQueue();
  renderNudger();
  addMobileSwitch();
}

function chartTitle() {
  if (currentPeriod === 'week')    return 'Activity this month — weekly view';
  if (currentPeriod === 'month')   return 'Activity this month — by week';
  if (currentPeriod === 'quarter') return 'Activity this quarter — by month';
  return 'Activity this year — by quarter';
}

function chartDataKey() {

// ── Deal Nudger ────────────────────────────────────────────────────────────────
let nudgerQueue = [];
let nudgerIdx = 0;

// Second line of defence. refresh_nudger.py already filters on
// hs_is_closed = false, but if the JSON is ever stale or hand-edited,
// nothing dead should reach the card.
const NUDGER_CLOSED_STAGES = new Set([
  'Sales Qualified Out',
  'Closed Lost',
  'Churned',
  'Paused',
  'Email activity'
]);

function nudgerStorageKey(rep) {
  const id = (rep && rep.rep && rep.rep.id) ? rep.rep.id : currentRepIdx;
  return 'nudgerIdx:' + id;
}

function buildNudgerQueue() {
  const rep = DATA.reps[currentRepIdx];

  nudgerQueue = (rep.nudger || []).filter(function (d) {
    return d && d.date && !NUDGER_CLOSED_STAGES.has(d.stage);
  });

  // Resume where you left off instead of restarting at deal 1 on every
  // rep switch and period-tab click.
  let saved = 0;
  try {
    saved = parseInt(localStorage.getItem(nudgerStorageKey(rep)) || '0', 10) || 0;
  } catch (e) {
    saved = 0;
  }
  nudgerIdx = nudgerQueue.length
    ? Math.min(Math.max(saved, 0), nudgerQueue.length - 1)
    : 0;
}

function daysAgo(dateStr) {
  if (!dateStr) return 0;
  const then = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - then) / 86400000);
}

function fmtAmount(v) {
  if (!v) return null;
  const n = Math.round(Number(v));
  if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + n.toLocaleString();
}

function renderNudger() {
  const wrap = document.getElementById('nudger-wrap');
  if (!wrap) return;
  if (!nudgerQueue.length) {
    wrap.innerHTML = '';
    return;
  }

  const deal = nudgerQueue[nudgerIdx];
  const days = daysAgo(deal.date);
  const amt = fmtAmount(deal.amount);
  const total = nudgerQueue.length;
  const pos = nudgerIdx + 1;

  wrap.innerHTML = `
    <div class="nudger-card">
      <div class="nudger-icon">⏰</div>
      <div class="nudger-body">
        <div class="nudger-eyebrow">Needs attention — deal ${pos} of ${total}</div>
        <div class="nudger-name">${deal.name}</div>
        <div class="nudger-meta">
          <span class="nudger-stage">${deal.stage}</span>
          <span class="nudger-days">${days} days since last activity</span>
          ${amt ? '<span class="nudger-amount">' + amt + '</span>' : ''}
        </div>
      </div>
      <div class="nudger-actions">
        <a class="nudger-open" href="${deal.url}" target="_blank" rel="noopener"
           onclick="setTimeout(nudgerNext, 400)">
          Open in HubSpot ↗
        </a>
        <button class="nudger-skip" onclick="nudgerNext()">Skip →</button>
        <div class="nudger-progress">${pos} / ${total}</div>
      </div>
    </div>`;
}

function nudgerNext() {
  if (!nudgerQueue.length) return;
  nudgerIdx = (nudgerIdx + 1) % nudgerQueue.length;
  try {
    localStorage.setItem(
      nudgerStorageKey(DATA.reps[currentRepIdx]),
      String(nudgerIdx)
    );
  } catch (e) {
    /* private window or storage blocked — position just won't persist */
  }
  renderNudger();
}

// ── Signed partners ───────────────────────────────────────────────────────────
// Forecast = the deal's HubSpot Amount when it was signed, which is expected
// annual gross profit. It is spread evenly per day, starting on the signature
// date, so a partner signed on the 20th is only expected to deliver 11 days'
// worth in that month.

function destroyPartnerCharts() {
  partnerCharts.forEach(c => c.destroy());
  partnerCharts = [];
}

function parseDay(s) { return new Date(s.slice(0, 10) + 'T00:00:00Z'); }
const DAY_MS = 86400000;

function monthLabel(m) {
  const d = new Date(m + '-01T00:00:00Z');
  return d.toLocaleString('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' });
}

// Days in month `m` (YYYY-MM) between signature and the last day with data.
function activeDays(m, signed, through) {
  const start = parseDay(m + '-01');
  const end = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 1)); // exclusive
  const from = Math.max(start, parseDay(signed));
  const to = Math.min(end, parseDay(through).getTime() + DAY_MS);
  return Math.max(0, Math.round((to - from) / DAY_MS));
}

function partnerSeries(p, through) {
  const daily = (p.forecast_annual_gp || 0) / 365;
  let cumA = 0, cumF = 0;
  return (p.months || []).map(r => {
    const days = activeDays(r.month, p.signed_date, through);
    const fc = daily * days;
    cumA += r.gross_profit || 0;
    cumF += fc;
    return { ...r, days, forecast: fc, cum_actual: cumA, cum_forecast: cumF };
  });
}

function partnerTotals(p, through) {
  const s = partnerSeries(p, through);
  const last = s[s.length - 1];
  const actual = last ? last.cum_actual : 0;
  // Forecast to date, even if no months of data have come in yet.
  const daysSince = Math.max(0, Math.round((parseDay(through).getTime() + DAY_MS - parseDay(p.signed_date)) / DAY_MS));
  const forecast = (p.forecast_annual_gp || 0) / 365 * daysSince;
  const lastFull = s.length ? s[s.length - 1] : null;
  return {
    series: s, actual, forecast, daysSince,
    variance: actual - forecast,
    variancePct: forecast > 0 ? (actual - forecast) / forecast : null,
    revenue: s.reduce((a, r) => a + (r.publisher_revenue || 0), 0),
    appsLive: lastFull ? lastFull.apps_live : null,
  };
}

function money(v, dp) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  const n = Number(v), a = Math.abs(n), sign = n < 0 ? '−' : '';
  if (a >= 1e6) return sign + '$' + (a / 1e6).toFixed(1) + 'M';
  if (a >= 1e4) return sign + '$' + (a / 1e3).toFixed(0) + 'K';
  if (a >= 1e3) return sign + '$' + (a / 1e3).toFixed(1) + 'K';
  return sign + '$' + a.toFixed(dp === undefined ? 0 : dp);
}

function bigNum(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  const n = Number(v);
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return String(Math.round(n));
}

function pct(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return (v >= 0 ? '+' : '−') + Math.abs(v * 100).toFixed(0) + '%';
}

function fmtDate(s) {
  return parseDay(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

              <td>${p.stage}</td>
              <td>${p.seller_id ? `<span class="sp-badge live">Seller ${p.seller_id}</span>` : '<span class="sp-badge none">No traffic</span>'}</td>
              <td class="num">${money(p.forecast_annual_gp)}</td>
              <td class="num">${money(t.forecast)}</td>
              <td class="num">${p.seller_id ? money(t.actual) : '—'}</td>
              <td class="num ${vClass(t.variancePct)}">${money(t.variance)} <span style="font-weight:400;font-size:11px">${pct(t.variancePct)}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

    ${rows.map(({ p, t }, i) => partnerCard(p, t, i)).join('')}

    <div class="page-footer">
      <div class="footer-text">Deals: HubSpot · Performance: Appodeal BI (Rill), BidMachine exchange</div>
      <a class="footer-link" href="https://app.hubspot.com/contacts/5606823/objects/0-3/" target="_blank" rel="noopener">View in HubSpot ↗</a>
    </div>`;

  rows.forEach(({ p, t }, i) => drawPartnerCharts(p, t, i));
  addMobileSwitch();
}

function partnerCard(p, t, i) {
  const vColor = t.variancePct === null ? 'var(--text)' : (t.variance >= 0 ? 'var(--accent2)' : 'var(--accent4)');
  const body = !p.seller_id || !t.series.length
    ? `<div class="sp-empty">${p.status_note || 'No BidMachine traffic found for this partner since signing.'}</div>`
    : `<div class="sp-charts">
        <div class="sp-chart"><div class="sp-chart-title">Gross profit vs forecast <span>monthly</span></div><div class="sp-chart-wrap"><canvas id="sp-gp-${i}"></canvas></div></div>
        <div class="sp-chart"><div class="sp-chart-title">Variance to forecast <span>cumulative</span></div><div class="sp-chart-wrap"><canvas id="sp-var-${i}"></canvas></div></div>
        <div class="sp-chart"><div class="sp-chart-title">Publisher revenue <span>monthly</span></div><div class="sp-chart-wrap"><canvas id="sp-rev-${i}"></canvas></div></div>
        <div class="sp-chart"><div class="sp-chart-title">Ad requests <span>monthly</span></div><div class="sp-chart-wrap"><canvas id="sp-req-${i}"></canvas></div></div>
        <div class="sp-chart"><div class="sp-chart-title">Apps live <span>bundles with requests</span></div><div class="sp-chart-wrap"><canvas id="sp-apps-${i}"></canvas></div></div>
      </div>`;

  return `
    <div class="sp-partner" id="sp-${i}">
      <div class="sp-partner-head">
        <div>
          <div class="sp-partner-name"><a href="${p.url}" target="_blank" rel="noopener">${p.name} ↗</a></div>
          <div class="sp-partner-sub">Signed ${fmtDate(p.signed_date)} · ${p.stage}${p.seller_id ? ' · Seller ID ' + p.seller_id : ''}</div>
        </div>
        <div class="sp-kpis">
          <div><div class="sp-kpi-label">Forecast to date</div><div class="sp-kpi-value">${money(t.forecast)}</div></div>
          <div><div class="sp-kpi-label">Actual GP</div><div class="sp-kpi-value">${p.seller_id ? money(t.actual) : '—'}</div></div>
          <div><div class="sp-kpi-label">Variance</div><div class="sp-kpi-value" style="color:${vColor}">${pct(t.variancePct)}</div></div>
          <div><div class="sp-kpi-label">Publisher revenue</div><div class="sp-kpi-value">${p.seller_id ? money(t.revenue) : '—'}</div></div>
        </div>
      </div>
      ${body}
    </div>`;
}

function drawPartnerCharts(p, t, i) {
  if (!p.seller_id || !t.series.length) return;
  const s = t.series;
  const labels = s.map(r => monthLabel(r.month) + (r.partial ? '*' : ''));
  const grid = { color: '#2a2f45' };
  const ticks = { color: '#6b7280', font: { size: 10 } };
  const tooltip = { backgroundColor: '#1e2336', titleColor: '#e8eaf0', bodyColor: '#9ca3af', borderColor: '#2a2f45', borderWidth: 1 };
  const base = (yFmt, legend) => ({
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: legend ? { display: true, position: 'bottom', labels: { color: '#9ca3af', boxWidth: 8, boxHeight: 8, font: { size: 10 } } } : { display: false },
      tooltip: { ...tooltip, callbacks: { label: c => (c.dataset.label ? c.dataset.label + ': ' : '') + yFmt(c.parsed.y) } },
    },
    scales: { x: { grid, ticks }, y: { grid, ticks: { ...ticks, callback: v => yFmt(v) }, beginAtZero: true } },
  });
  const make = (id, cfg) => {
    const el = document.getElementById(id);
    if (el) partnerCharts.push(new Chart(el, cfg));
  };
  const money2 = v => money(v, Math.abs(v) < 100 ? 0 : 0);

  make('sp-gp-' + i, {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Actual GP', data: s.map(r => r.gross_profit), backgroundColor: '#4f7cff', borderRadius: 4, order: 2 },
      { label: 'Forecast', type: 'line', data: s.map(r => r.forecast), borderColor: '#f59e0b', backgroundColor: '#f59e0b', borderDash: [4, 3], pointRadius: 3, order: 1 },
    ] },
    options: base(money2, true),
  });

  make('sp-var-' + i, {
    type: 'line',
    data: { labels, datasets: [
      { label: 'Actual (cum.)', data: s.map(r => r.cum_actual), borderColor: '#34d399', backgroundColor: 'rgba(52,211,153,.12)', fill: true, pointRadius: 3, tension: .25 },
      { label: 'Forecast (cum.)', data: s.map(r => r.cum_forecast), borderColor: '#f59e0b', borderDash: [4, 3], pointRadius: 3, tension: .25 },
    ] },
    options: base(money2, true),
  });

  make('sp-rev-' + i, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Publisher revenue', data: s.map(r => r.publisher_revenue), backgroundColor: '#a78bfa', borderRadius: 4 }] },
    options: base(money2, false),
  });

  make('sp-req-' + i, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Ad requests', data: s.map(r => r.requests), backgroundColor: '#0ea5e9', borderRadius: 4 }] },
    options: base(bigNum, false),
  });

  const appsOpts = base(v => String(Math.round(v)), false);
  appsOpts.scales.y.ticks.precision = 0;
  make('sp-apps-' + i, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Apps live', data: s.map(r => r.apps_live), backgroundColor: '#6ee7b7', borderRadius: 4 }] },
    options: appsOpts,
  });
}

boot();
</script>
</body>
</html>
